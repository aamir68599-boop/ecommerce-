<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silkora Admin Panel</title>
<style>
:root{--primary:#d81b60;--primary-hover:#b0154d;--dark:#1a1a1a;--sidebar-bg:#23282d;--sidebar-hover:#32373c;--border:#e0e0e0;--bg:#f1f1f1;--white:#fff;--success:#28a745;--danger:#dc3545;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--dark);line-height:1.5}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d81b60,#4B0082);z-index:9999;padding:20px}
.login-card{background:#fff;padding:40px 32px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card .brand{font-family:Georgia,serif;font-size:32px;letter-spacing:6px;text-align:center;color:var(--primary);margin-bottom:24px}
.login-card h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px}
.login-card .subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:#444}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;transition:border .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-group textarea{min-height:90px;resize:vertical}
.error-msg{color:var(--danger);font-size:12px;margin-bottom:12px;min-height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#e0e0e0;color:#333}
.btn-secondary:hover{background:#d0d0d0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c82333}
.btn-block{width:100%}.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.6;cursor:not-allowed}
#adminPanel{display:none;min-height:100vh}
.admin-layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-brand{font-family:Georgia,serif;font-size:22px;letter-spacing:4px;padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.08);color:var(--primary)}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:#c8c8c8;font-size:14px;text-decoration:none;transition:all .2s;border-left:3px solid transparent}
.sidebar-nav a:hover{background:var(--sidebar-hover);color:#fff}
.sidebar-nav a.active{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary)}
.sidebar-nav a span{font-size:16px}
.sidebar-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,.08)}
.user-info{font-size:11px;color:#999;margin-bottom:10px;word-break:break-all}
.btn-logout{width:100%;padding:9px;background:transparent;color:#ff6b6b;border:1px solid rgba(255,107,107,.3);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-logout:hover{background:rgba(255,107,107,.1)}
.content{flex:1;min-width:0}
.topbar{background:#fff;padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:12px}
.topbar h1{font-size:20px;font-weight:600}
#viewContainer{padding:28px 32px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#fff;padding:20px 24px;border-radius:10px;border-left:4px solid var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-card .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .stat-value{font-size:26px;font-weight:700}
.data-table{width:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.data-table table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:14px 18px;background:#fafafa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.data-table td{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafafa}
.data-table .thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#f5f5f5}
.data-table .actions{display:flex;gap:6px}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-active{background:#d4edda;color:#155724}
.badge-draft{background:#fff3cd;color:#856404}
.badge-out{background:#f8d7da;color:#721c24}
.empty-state{text-align:center;padding:60px 20px;background:#fff;border-radius:10px;color:var(--muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal.open{display:flex}
.modal-content{background:#fff;border-radius:12px;width:100%;max-width:640px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .2s ease}
.modal-sm{max-width:400px}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-close:hover{color:var(--dark)}
.modal-body{padding:24px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.img-preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.img-preview .img-item{position:relative;width:80px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:#f5f5f5}
.img-preview .img-item img{width:100%;height:100%;object-fit:cover}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.upload-zone:hover{border-color:var(--primary);background:#fff}
.upload-zone input{display:none}
.upload-zone .upload-text{font-size:13px;color:var(--muted)}
.upload-zone .upload-text strong{color:var(--primary)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 22px;border-radius:8px;color:#fff;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(100px);opacity:0;transition:all .3s;z-index:2000;max-width:360px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){
  .admin-layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;align-items:center}
  .sidebar-brand{padding:14px 18px;border-bottom:none;font-size:16px;letter-spacing:2px}
  .sidebar-nav{display:flex;padding:0;flex:1;overflow-x:auto}
  .sidebar-nav a{padding:14px 16px;white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  .sidebar-nav a.active{border-left:none;border-bottom-color:var(--primary)}
  .sidebar-nav a span{display:none}
  .sidebar-footer{padding:10px 14px;border-top:none}
  .user-info{display:none}.btn-logout{width:auto;padding:8px 12px}
  .topbar{padding:16px 20px}.topbar h1{font-size:17px}
  #viewContainer{padding:20px}
  .data-table{overflow-x:auto;display:block}
  .data-table table{min-width:700px}
  .row-2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">SILKORA</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your store</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="admin@silkora.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <div id="loginError" class="error-msg"></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">SILKORA</div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a href="#" data-view="dashboard" class="active"><span>📊</span> Dashboard</a>
        <a href="#" data-view="products"><span>🛍️</span> Products</a>
        <a href="#" data-view="categories"><span>📂</span> Categories</a>
        <a href="#" data-view="collections"><span>🎨</span> Collections</a>
        <a href="#" data-view="banners"><span>🖼️</span> Banners</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="userInfo"></div>
        <button id="logoutBtn" class="btn-logout">🚪 Logout</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <button id="addNewBtn" class="btn btn-primary" style="display:none;">+ Add New</button>
      </header>
      <div id="viewContainer"></div>
    </main>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Form</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- CONFIRM -->
<div id="confirmDialog" class="modal">
  <div class="modal-content modal-sm">
    <div class="modal-header"><h3>Confirm Action</h3><button class="modal-close" id="confirmClose">&times;</button></div>
    <div class="modal-body">
      <p id="confirmMessage">Are you sure?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
// Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

// NAYA FIREBASE CONFIG (silkora-1e012)
const firebaseConfig = {
  apiKey: "AIzaSyCNqkO0dMZPAYFYhOIriI43OHYleYq_Bi4",
  authDomain: "silkora-1e012.firebaseapp.com",
  projectId: "silkora-1e012",
  storageBucket: "silkora-1e012.firebasestorage.app",
  messagingSenderId: "762081890287",
  appId: "1:762081890287:web:fa6b3291f2db05ad6c301a",
  measurementId: "G-1B3SCN4CZW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// STATE
const state = { currentView: 'dashboard', products: [], categories: [], collections: [], banners: [], unsubscribers: {} };
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// HARDCODED LOGIN
const ADMIN_EMAIL = "admin@silkora.com";
const ADMIN_PASSWORD = "admin123";

// HELPERS
function toast(msg, type = 'success') {
  const t = $('#toast');
  t.className = `toast ${type} show`;
  t.textContent = msg;
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 3500);
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function uploadImage(file, folder = 'uploads') {
  if (!file) return null;
  const filename = `${folder}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
  const r = sRef(storage, filename);
  await uploadBytes(r, file);
  return await getDownloadURL(r);
}
function showModal(title, bodyHtml) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modal').classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }
function confirmDelete(message) {
  return new Promise(resolve => {
    $('#confirmMessage').textContent = message;
    $('#confirmDialog').classList.add('open');
    const cleanup = () => { $('#confirmDialog').classList.remove('open'); };
    $('#confirmOk').onclick = () => { cleanup(); resolve(true); };
    $('#confirmCancel').onclick = () => { cleanup(); resolve(false); };
    $('#confirmClose').onclick = () => { cleanup(); resolve(false); };
  });
}

// SLUG GENERATOR
function generateSlug(text) {
  return text.toString().toLowerCase().trim()
    .replace(/\s+/g, '-')       // spaces to hyphens
    .replace(/[^\w\-]+/g, '')   // remove non-word chars
    .replace(/\-\-+/g, '-')     // multiple hyphens to one
    .replace(/^-+/, '')         // trim hyphens from start
    .replace(/-+$/, '');        // trim hyphens from end
}

async function getUniqueSlug(baseSlug, existingId = null) {
  let slug = baseSlug;
  let counter = 1;
  while (true) {
    const q = query(collection(db, "products"), where("slug", "==", slug));
    const snapshot = await getDocs(q);
    // Agar koi document mila aur wo same product nahi hai (edit case), toh counter badhao
    const docs = snapshot.docs.filter(d => d.id !== existingId);
    if (docs.length === 0) return slug;
    counter++;
    slug = `${baseSlug}-${counter}`;
  }
}

// LOGIN LOGIC
$('#loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = $('#loginEmail').value.trim();
  const pass = $('#loginPassword').value;
  const err = $('#loginError');
  err.textContent = '';

  if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
    $('#loginScreen').style.display = 'none';
    $('#adminPanel').style.display = 'block';
    $('#userInfo').textContent = email;
    startListeners();
    renderDashboard();
  } else {
    err.textContent = 'Galat Email ya Password!';
  }
});

$('#logoutBtn').addEventListener('click', async () => { 
  if (await confirmDelete('Logout from admin?')) {
    stopListeners();
    $('#loginScreen').style.display = 'flex';
    $('#adminPanel').style.display = 'none';
    $('#loginEmail').value = '';
    $('#loginPassword').value = '';
  }
});

function stopListeners() {
  Object.values(state.unsubscribers).forEach(fn => fn && fn());
  state.unsubscribers = {};
}

function startListeners() {
  stopListeners();
  state.unsubscribers.products = onSnapshot(query(collection(db, 'products'), orderBy('createdAt', 'desc')), snap => {
    state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.currentView === 'dashboard') renderDashboard();
    if (state.currentView === 'products') renderProducts();
  }, (error) => { toast('Data load fail: Firestore rules check karein', 'error'); });
  
  state.unsubscribers.categories = onSnapshot(collection(db, 'categories'), snap => {
    state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.currentView === 'dashboard') renderDashboard();
    if (state.currentView === 'categories') renderCategories();
  });

  state.unsubscribers.collections = onSnapshot(collection(db, 'collections'), snap => {
    state.collections = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.currentView === 'dashboard') renderDashboard();
    if (state.currentView === 'collections') renderCollections();
  });

  state.unsubscribers.banners = onSnapshot(collection(db, 'banners'), snap => {
    state.banners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.currentView === 'dashboard') renderDashboard();
    if (state.currentView === 'banners') renderBanners();
  });
}

// NAVIGATION
$('#sidebarNav').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-view]');
  if (!a) return;
  e.preventDefault();
  const view = a.dataset.view;
  $$('#sidebarNav a').forEach(x => x.classList.toggle('active', x === a));
  state.currentView = view;
  const titles = { dashboard:'Dashboard', products:'Products', categories:'Categories', collections:'Collections', banners:'Banners' };
  $('#pageTitle').textContent = titles[view];
  $('#addNewBtn').style.display = view === 'dashboard' ? 'none' : 'inline-flex';
  const labels = { products:'+ Add Product', categories:'+ Add Category', collections:'+ Add Collection', banners:'+ Add Banner' };
  $('#addNewBtn').textContent = labels[view];
  const r = { dashboard:renderDashboard, products:renderProducts, categories:renderCategories, collections:renderCollections, banners:renderBanners };
  r[view]();
});
$('#addNewBtn').addEventListener('click', () => {
  const v = state.currentView;
  if (v === 'products') openProductForm();
  else if (v === 'categories') openCategoryForm();
  else if (v === 'collections') openCollectionForm();
  else if (v === 'banners') openBannerForm();
});

// DASHBOARD
function renderDashboard() {
  const totalProducts = state.products.length;
  const activeProducts = state.products.filter(p => p.status === 'active').length;
  const outOfStock = state.products.filter(p => Number(p.stock) <= 0).length;
  $('#viewContainer').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Products</div><div class="stat-value">${totalProducts}</div></div>
      <div class="stat-card" style="border-left-color:#28a745"><div class="stat-label">Active</div><div class="stat-value">${activeProducts}</div></div>
      <div class="stat-card" style="border-left-color:#ffc107"><div class="stat-label">Out of Stock</div><div class="stat-value">${outOfStock}</div></div>
      <div class="stat-card" style="border-left-color:#17a2b8"><div class="stat-label">Categories</div><div class="stat-value">${state.categories.length}</div></div>
      <div class="stat-card" style="border-left-color:#6f42c1"><div class="stat-label">Collections</div><div class="stat-value">${state.collections.length}</div></div>
      <div class="stat-card" style="border-left-color:#fd7e14"><div class="stat-label">Banners</div><div class="stat-value">${state.banners.length}</div></div>
    </div>
    <div style="background:#fff;padding:24px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)">
      <h2 style="font-size:16px;margin-bottom:14px">Quick Actions</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button class="btn btn-primary" onclick="window.__goTo('products');setTimeout(()=>window.__addProduct(),100)">+ Add Product</button>
        <button class="btn btn-secondary" onclick="window.__goTo('categories')">Categories</button>
        <button class="btn btn-secondary" onclick="window.__goTo('collections')">Collections</button>
        <button class="btn btn-secondary" onclick="window.__goTo('banners')">Banners</button>
      </div>
    </div>
  `;
}

// PRODUCTS
function productStatusBadge(p) {
  if (p.status === 'active' && Number(p.stock || 0) > 0) return '<span class="badge badge-active">Active</span>';
  if (Number(p.stock || 0) <= 0) return '<span class="badge badge-out">Out of Stock</span>';
  return '<span class="badge badge-draft">Draft</span>';
}
function renderProducts() {
  if (!state.products.length) {
    $('#viewContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">🛍️</div><p>No products yet. Click "+ Add Product".</p></div>`;
    return;
  }
  const rows = state.products.map(p => `
    <tr>
      <td>${p.image ? `<img class="thumb" src="${escapeHtml(p.image)}" alt="">` : '<div class="thumb"></div>'}</td>
      <td><strong>${escapeHtml(p.name || 'Untitled')}</strong><br><small style="color:#888">${escapeHtml(p.sku || '')}</small><br><small style="color:var(--primary)">?slug=${escapeHtml(p.slug || '')}</small></td>
      <td>₹${Number(p.price || 0).toLocaleString('en-IN')}</td>
      <td>${escapeHtml(p.category || '-')}</td>
      <td>${Number(p.stock || 0)}</td>
      <td>${productStatusBadge(p)}</td>
      <td><div class="actions">
        <button class="btn btn-secondary btn-sm" data-edit="${p.id}">Edit</button>
        <button class="btn btn-danger btn-sm" data-delete="${p.id}">Delete</button>
      </div></td>
    </tr>`).join('');
  $('#viewContainer').innerHTML = `<div class="data-table"><table>
    <thead><tr><th>Image</th><th>Name & Slug</th><th>Price</th><th>Category</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $$('#viewContainer [data-edit]').forEach(b => b.onclick = () => { const p = state.products.find(x => x.id === b.dataset.edit); if (p) openProductForm(p); });
  $$('#viewContainer [data-delete]').forEach(b => b.onclick = async () => {
    if (await confirmDelete('Delete this product permanently?')) {
      try { await deleteDoc(doc(db, 'products', b.dataset.delete)); toast('Product deleted'); }
      catch (e) { toast('Delete failed: ' + e.message, 'error'); }
    }
  });
}
function openProductForm(existing = null) {
  const isEdit = !!existing;
  const catOptions = state.categories.map(c => `<option value="${escapeHtml(c.name)}" ${existing?.category === c.name ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  showModal(isEdit ? 'Edit Product' : 'Add New Product', `
    <form id="productForm">
      <div class="form-group"><label>Product Name *</label><input type="text" id="p_name" required value="${escapeHtml(existing?.name || '')}"></div>
      <div class="row-2">
        <div class="form-group"><label>Price (₹) *</label><input type="number" id="p_price" required min="0" step="0.01" value="${existing?.price || ''}"></div>
        <div class="form-group"><label>Original Price (₹)</label><input type="number" id="p_originalPrice" min="0" step="0.01" value="${existing?.originalPrice || ''}"></div>
      </div>
      <div class="row-2">
        <div class="form-group"><label>SKU</label><input type="text" id="p_sku" value="${escapeHtml(existing?.sku || '')}"></div>
        <div class="form-group"><label>Stock</label><input type="number" id="p_stock" min="0" value="${existing?.stock ?? 10}"></div>
      </div>
      <div class="row-2">
        <div class="form-group"><label>Category</label><select id="p_category"><option value="">— Select —</option>${catOptions}</select></div>
        <div class="form-group"><label>Badge</label><input type="text" id="p_badge" placeholder="e.g. New Arrivals" value="${escapeHtml(existing?.badge || '')}"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="p_description">${escapeHtml(existing?.description || '')}</textarea></div>
      <div class="form-group"><label>Main Image ${isEdit ? '(leave to keep current)' : '*'}</label>
        <div class="upload-zone"><input type="file" id="p_image" accept="image/*"><div class="upload-text"><strong>Click to upload</strong></div></div>
        <div class="img-preview" id="p_preview">${existing?.image ? `<div class="img-item"><img src="${escapeHtml(existing.image)}" alt=""></div>` : ''}</div>
      </div>
      <div class="form-group"><label>Gallery Images</label>
        <div class="upload-zone"><input type="file" id="p_gallery" accept="image/*" multiple><div class="upload-text"><strong>Click to upload</strong> multiple</div></div>
        <div class="img-preview" id="p_galleryPreview">${(existing?.images || []).map(u => `<div class="img-item"><img src="${escapeHtml(u)}" alt=""></div>`).join('')}</div>
      </div>
      <div class="form-group"><label>Status</label><select id="p_status"><option value="active" ${existing?.status !== 'draft' ? 'selected' : ''}>Active</option><option value="draft" ${existing?.status === 'draft' ? 'selected' : ''}>Draft</option></select></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="p_submit">${isEdit ? 'Update' : 'Create'}</button>
      </div>
    </form>`);
  $('#p_image').onchange = e => { const f = e.target.files[0]; if (f) $('#p_preview').innerHTML = `<div class="img-item"><img src="${URL.createObjectURL(f)}"></div>`; };
  $('#p_gallery').onchange = e => {
    Array.from(e.target.files).forEach(f => {
      const d = document.createElement('div'); d.className = 'img-item';
      d.innerHTML = `<img src="${URL.createObjectURL(f)}">`;
      $('#p_galleryPreview').appendChild(d);
    });
  };
  
  // SUBMIT WITH SLUG GENERATION
  $('#productForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#p_submit'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...';
    try {
      let image = existing?.image || null;
      const f = $('#p_image').files[0];
      if (f) image = await uploadImage(f, 'products');
      let images = existing?.images || [];
      const newFiles = Array.from($('#p_gallery').files);
      if (newFiles.length) {
        const uploaded = await Promise.all(newFiles.map(f => uploadImage(f, 'products')));
        images = [...images, ...uploaded.filter(Boolean)];
      }

      // Yahan Slug Taiyaar Hoga
      const productName = $('#p_name').value.trim();
      const baseSlug = generateSlug(productName);
      const uniqueSlug = await getUniqueSlug(baseSlug, existing?.id);

      const data = {
        name: productName,
        slug: uniqueSlug, // 🔥 Auto Generated Slug
        price: Number($('#p_price').value) || 0,
        originalPrice: Number($('#p_originalPrice').value) || null,
        sku: $('#p_sku').value.trim(),
        stock: Number($('#p_stock').value) || 0,
        category: $('#p_category').value,
        badge: $('#p_badge').value.trim() || 'New Arrivals',
        description: $('#p_description').value.trim(),
        status: $('#p_status').value,
        image, images,
        updatedAt: serverTimestamp(),
      };
      if (existing?.id) { await updateDoc(doc(db, 'products', existing.id), data); toast('Product updated'); }
      else { data.createdAt = serverTimestamp(); await addDoc(collection(db, 'products'), data); toast('Product created with slug: ' + uniqueSlug); }
      closeModal();
    } catch (err) { toast('Failed: ' + err.message, 'error'); btn.disabled = false; btn.textContent = isEdit ? 'Update' : 'Create'; }
  };
}

// CATEGORIES
function renderCategories() {
  if (!state.categories.length) { $('#viewContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><p>No categories yet.</p></div>`; return; }
  const sorted = [...state.categories].sort((a, b) => (a.order || 0) - (b.order || 0));
  const rows = sorted.map(c => `
    <tr>
      <td>${c.image ? `<img class="thumb" style="border-radius:50%" src="${escapeHtml(c.image)}">` : '<div class="thumb"></div>'}</td>
      <td><strong>${escapeHtml(c.name)}</strong></td>
      <td>${c.order ?? 0}</td>
      <td>${c.status === 'active' ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-draft">Hidden</span>'}</td>
      <td><div class="actions">
        <button class="btn btn-secondary btn-sm" data-edit="${c.id}">Edit</button>
        <button class="btn btn-danger btn-sm" data-delete="${c.id}">Delete</button>
      </div></td>
    </tr>`).join('');
  $('#viewContainer').innerHTML = `<div class="data-table"><table>
    <thead><tr><th>Image</th><th>Name</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $$('#viewContainer [data-edit]').forEach(b => b.onclick = () => { const c = state.categories.find(x => x.id === b.dataset.edit); if (c) openCategoryForm(c); });
  $$('#viewContainer [data-delete]').forEach(b => b.onclick = async () => {
    if (await confirmDelete('Delete this category?')) { try { await deleteDoc(doc(db, 'categories', b.dataset.delete)); toast('Deleted'); } catch (e) { toast('Failed', 'error'); } }
  });
}
